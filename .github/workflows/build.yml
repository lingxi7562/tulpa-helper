name: Build & Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"
  ANDROID_API: "36"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "26.1.10909125"

jobs:
  source-quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Reject tracked runtime and ignored files
        shell: bash
        run: |
          ignored="$(git ls-files -ci --exclude-standard)"
          if [ -n "$ignored" ]; then
            echo "Tracked files are hidden by .gitignore:"
            echo "$ignored"
            exit 1
          fi
          if git ls-files --error-unmatch .superpowers >/dev/null 2>&1; then
            echo ".superpowers runtime state must never be tracked"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify configuration parity
        run: node .github/scripts/verify-config.mjs

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Setup Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build-windows:
    needs: source-quality
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build
        run: npm run tauri build

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/tulpa-helper.exe"
          if (-not (Test-Path $exe)) { Write-Error "Binary not found: $exe"; exit 1 }
          $bundles = @(Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -File -ErrorAction SilentlyContinue)
          if ($bundles.Count -eq 0) { Write-Error "No native Windows bundle was produced"; exit 1 }
          Compress-Archive -Path $exe -DestinationPath tulpa-helper-windows.zip

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v7
        with:
          name: tulpa-helper-windows
          path: |
            tulpa-helper-windows.zip
            src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14

  build-linux:
    needs: source-quality
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build
        run: npm run tauri build

      - name: Package portable tar.gz
        run: |
          bundle="$(find src-tauri/target/release/bundle -type f -print -quit 2>/dev/null)"
          if [ -z "$bundle" ]; then
            echo "No native Linux bundle was produced"
            exit 1
          fi
          cp src-tauri/target/release/tulpa-helper .
          tar czf tulpa-helper-linux.tar.gz tulpa-helper

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v7
        with:
          name: tulpa-helper-linux
          path: |
            tulpa-helper-linux.tar.gz
            src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14

  build-android:
    needs: source-quality
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: true

      - name: Install NDK and SDK components
        run: |
          sdkmanager --install \
            "ndk;${ANDROID_NDK_VERSION}" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Configure Android env
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Setup Rust with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Init Android project
        run: npx tauri android init --ci

      - name: Build Android APK (debug, arm64-v8a only)
        run: npx tauri android build --apk --debug --split-per-abi --target aarch64

      - name: Verify Android APK is arm64-v8a only
        shell: bash
        run: |
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one split APK, found ${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          apk="${apks[0]}"
          abis="$(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && NF >= 2 {print $2}' | sort -u)"
          if [ "$abis" != "arm64-v8a" ]; then
            echo "Expected only lib/arm64-v8a in $apk, found:"
            printf '%s\n' "$abis"
            exit 1
          fi
          echo "Verified arm64-v8a-only APK: $apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: tulpa-helper-android-arm64-v8a
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
